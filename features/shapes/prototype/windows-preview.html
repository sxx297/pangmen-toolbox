<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows 插件界面预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eae7e3;font:14px/1.5 system-ui;color:#36302c}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#faf9f7;border-bottom:1px solid #dcd6d0}header span{font-size:12px;color:#81766d}button,select{font:inherit;padding:5px 10px;border:1px solid #ded8d1;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button:hover{color:#f50}main{display:flex;justify-content:center;padding:12px;height:calc(100vh - 100px);min-height:420px}iframe{height:100%;width:420px;max-width:100%;border:1px solid #d8d2cb;border-radius:10px;background:#fcfcfc;box-shadow:0 6px 24px #35241916}header [hidden]{display:none}label{display:flex;gap:5px;align-items:center}</style>
<header><strong>旁门 · Windows 界面预览</strong><label>形式<select id="mode"><option value="docked">右侧面板</option><option value="floating">悬浮面板</option></select></label><label>宽度<select id="width"><option>360</option><option selected>420</option><option>480</option><option>560</option><option>1000</option></select></label><label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>形状<select id="shape"><option value="roundedRect">圆角矩形</option><option value="rectangle">矩形</option><option value="ellipse">椭圆</option><option value="circle">正圆</option></select></label><button id="refresh">刷新预览</button><span>示例画面，可操作参数与预设；不连接 PPT。保存代码后自动刷新。</span></header>
<main><iframe title="插件面板" id="frame"></iframe></main>
<script>
const frame=document.getElementById('frame'),mode=document.getElementById('mode'),width=document.getElementById('width'),theme=document.getElementById('theme'),shape=document.getElementById('shape');
function send(action,value){frame.contentWindow?.postMessage({type:'pangmen-preview',action,value},'*');}
const feature=document.createElement('select');feature.id='feature';feature.setAttribute('aria-label','预览功能');feature.append(new Option('形状效果','material'),new Option('PDF 导出','pdf'));document.querySelector('header strong').after(feature);
feature.value=new URLSearchParams(location.search).get('feature')==='pdf'?'pdf':'material';
function reload(){const pdf=feature.value==='pdf';frame.style.width=pdf?'1200px':width.value+'px';for(const e of [mode,width,theme,shape])e.closest('label').hidden=pdf;frame.title=pdf?'PDF 导出预览':'插件面板';frame.src=pdf?'pdf-export.html?preview=1&v='+Date.now():'windows-preview-frame.html?mode='+mode.value+'&theme='+theme.value+'&v='+Date.now();}
feature.onchange=reload;
mode.onchange=()=>{width.value=mode.value==='floating'?'1000':'420';frame.style.width=width.value+'px';send('mode',mode.value);};
width.onchange=()=>{frame.style.width=width.value+'px';};theme.onchange=()=>send('theme',theme.value);shape.onchange=()=>send('shape',shape.value);document.getElementById('refresh').onclick=reload;frame.onload=()=>send('shape',shape.value);reload();
let stamp;setInterval(async()=>{try{const r=await fetch('/preview-version',{cache:'no-store'});if(!r.ok)return;const next=await r.text();if(stamp&&stamp!==next)reload();stamp=next;}catch{}},1500);
</script></html>
