      <div class="ml-preset-toolbar"><span id="ml-current-preset" title="当前材质">冰蓝弥散</span><button type="button" class="ml-action" id="ml-reset-preset" title="恢复当前预设载入或保存时的参数" disabled>重置</button><button type="button" class="ml-action" id="ml-open-library">预设库</button><button type="button" class="ml-action" id="ml-save-preset">保存预设</button></div>

      </div>

        <label class="ml-field"><span class="ml-label">背景模糊<output id="ml-blur-value">12</output></span><input id="ml-blur" data-global-key="blur" type="range" min="0" max="100" value="12"></label>

        <div class="ml-grid">

        </div>
        </details>
      </div>

        </div></div></div>

          <div class="ml-row ml-layer-meta"><label class="ml-color"><input id="ml-layer-color" type="color" value="#345bff" aria-label="图层颜色">颜色</label><label class="ml-check" id="ml-contour-toggle-field"><input type="checkbox" id="ml-layer-contour">贴边色光</label></div>
          <div class="ml-grid">

          </div>
          </div>
          <div id="ml-shadow-help" hidden><button type="button" class="ml-action ml-compact" id="ml-shadow-glow">设为内发光</button></div>
        </div>
